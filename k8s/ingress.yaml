apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticsol-ingress
  namespace: ticsol-logistics
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.ticsol.com
    - app.ticsol.com
    secretName: ticsol-tls
  rules:
  - host: api.ticsol.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3000
  - host: app.ticsol.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
