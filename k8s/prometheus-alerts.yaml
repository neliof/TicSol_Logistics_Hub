apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
    - name: ticsol_alerts
      interval: 30s
      rules:

      # Backend alerts
      - alert: BackendDown
        expr: up{job="ticsol-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend pod is down"
          description: "Backend pod {{ $labels.pod }} in {{ $labels.namespace }} has been down for more than 1 minute"

      - alert: BackendHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="ticsol-backend",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="ticsol-backend"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High error rate in backend"
          description: "Backend error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: BackendHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="ticsol-backend"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High latency in backend"
          description: "Backend p95 latency is {{ $value }}s (threshold: 1s)"

      - alert: BackendOutOfMemory
        expr: container_memory_usage_bytes{pod=~"backend-.*"} / container_spec_memory_limit_bytes{pod=~"backend-.*"} > 0.9
        for: 2m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend pod memory usage high"
          description: "Backend pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }}"

      # Database alerts
      - alert: PostgreSQLDown
        expr: up{job="postgresql"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been unreachable for more than 1 minute"

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count > 90
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High number of PostgreSQL connections"
          description: "PostgreSQL has {{ $value }} active connections (max: 100)"

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "PostgreSQL replication lag"
          description: "Replication lag is {{ $value }}s (threshold: 30s)"

      - alert: PostgreSQLDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"} < 0.1
        for: 5m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL disk space running low"
          description: "PostgreSQL disk usage is {{ $value | humanizePercentage }} available"

      # Kubernetes alerts
      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          service: kubernetes
        annotations:
          summary: "Kubernetes node not ready"
          description: "Node {{ $labels.node }} has been in NotReady state for more than 5 minutes"

      - alert: KubernetesPodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{namespace="ticsol-logistics"}[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Kubernetes pod crash looping"
          description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash looping"

      - alert: KubernetesPersistentVolumeFull
        expr: |
          (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.9
        for: 5m
        labels:
          severity: critical
          service: kubernetes
        annotations:
          summary: "Kubernetes persistent volume almost full"
          description: "PV {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

      # Cluster health
      - alert: PrometheusScrapeErrors
        expr: increase(prometheus_tsdb_symbol_table_size_bytes[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Prometheus scrape errors"
          description: "Prometheus is having scrape errors"
