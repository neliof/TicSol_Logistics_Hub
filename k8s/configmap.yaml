apiVersion: v1
kind: ConfigMap
metadata:
  name: ticsol-config
  namespace: ticsol-logistics
data:
  # Database
  db-host: "postgres.ticsol-logistics.svc.cluster.local"
  db-port: "5432"
  db-name: "ticsol_logistics_hub"
  db-user: "app_user"

  # CORS
  cors-origin: "https://app.ticsol.com"

  # API
  api-url: "https://api.ticsol.com"

  # ARTSOFT
  artsoft-host: "erp.company.local"
  artsoft-port: "8080"

  # Logging
  log-level: "info"
  log-format: "json"
